name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill in as much as you can.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, including the GitHub PR URL shape if relevant.
      placeholder: |
        1. Open a PR Files changed page
        2. Turn on Markdup on a .md file
        3. …
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Area
      options:
        - Rich Markdown view / Before-After
        - Header switch / file discovery
        - Comments on selection
        - OAuth / GitHub connect
        - Personal access token
        - GitHub UI changed (selectors / layout)
        - Build / install / load unpacked
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Markdup version / commit
      description: Extension version (e.g. 0.1.0) or git SHA if building from source.
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 131
